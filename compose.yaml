name: sysadmin-devops-pet-project

services:
  db:
    image: postgres:16
    env_file:
      - path: ${TASKBOARD_ENV_DIR:-/home/tarabk/.config/taskboard}/postgres.env
        format: raw
      - path: ${TASKBOARD_ENV_DIR:-/home/tarabk/.config/taskboard}/bootstrap.env
        format: raw
    volumes:
      - "db_data:/var/lib/postgresql/data"
      - type: bind
        source: ./deploy/postgres/init
        target: /docker-entrypoint-initdb.d
        read_only: true
        bind:
          create_host_path: false
          selinux: Z
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: taskboard-backend:pet-lab
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: ${TASKBOARD_ENV_DIR:-/home/tarabk/.config/taskboard}/backend.env
        format: raw
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: taskboard-frontend:pet-lab
    build:
      context: .
      dockerfile: deploy/nginx/Dockerfile
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: taskboard-backend:pet-lab
    profiles: ["tools"]
    env_file:
      - path: ${TASKBOARD_ENV_DIR:-/home/tarabk/.config/taskboard}/migration.env
        format: raw
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "alembic", "upgrade", "head"]

volumes:
  db_data:
    external: true
    name: taskboard-sqldata
