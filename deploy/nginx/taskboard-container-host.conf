server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tarabk-pet.polandcentral.cloudapp.azure.com;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/taskboard;
        allow all;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://tarabk-pet.polandcentral.cloudapp.azure.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tarabk-pet.polandcentral.cloudapp.azure.com;

    ssl_certificate /etc/letsencrypt/live/tarabk-pet.polandcentral.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarabk-pet.polandcentral.cloudapp.azure.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    allow 127.0.0.1;
    allow ::1;
    allow 134.249.9.138;
    deny all;

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/taskboard;
        allow all;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
