server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tarabk-pet.polandcentral.cloudapp.azure.com;

    # Keep certificate over HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/taskboard;
        allow all;
        default_type text/plain;
        try_files $uri =404;
    }

    # Redirect requests to HTTPS.
    location / {
        return 308 https://tarabk-pet.polandcentral.cloudapp.azure.com$request_uri;
    }
}
server {
    server_name tarabk-pet.polandcentral.cloudapp.azure.com;

    # HTTPS connections IPv4, IPv6.
    listen 443 ssl;
    listen [::]:443 ssl;

# Certificate chain, private key.
ssl_certificate /etc/letsencrypt/live/tarabk-pet.polandcentral.cloudapp.azure.com/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/tarabk-pet.polandcentral.cloudapp.azure.com/privkey.pem;

# TLS ver.
ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/taskboard;
    index index.html;
	allow 127.0.0.1;
	allow ::1;
	allow 134.249.9.138;
	deny all;
    location / {
        try_files $uri $uri/ =404;
    }
location ^~ /.well-known/acme-challenge/ {
    allow all;
    default_type text/plain;
    try_files $uri =404;
}
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
